<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 제목</title>

  <!-- 부트스트랩 스타일 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- JS 연결 (필요시) -->
  <script src="js/파일명.js" defer></script>


    <section class="vh-100" style="background-color: #090e07;">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col col-xl-10">
            <div class="card" style="border-radius: 1rem;">
            <div class="row g-0">
                <div class="col-md-6 col-lg-5 d-none d-md-block">
                <img src="../image/login.LOGO.png"
                    alt="login form" class="img-fluid" style="border-radius: 1rem 0 0 1rem;" />
                </div>
                <div class="col-md-6 col-lg-7 d-flex align-items-center">
                <div class="card-body p-4 p-lg-5 text-black">

                <form method="get" action="../index.html" id="login_form">

                    <div class="d-flex align-items-center mb-3 pb-1">
                        <i class="fas fa-cubes fa-2x me-3" style="color: #ff6219;"></i>
                        <span class="h1 fw-bold mb-0">Sooq</span>
                    </div>

                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">귀하의 계정에 로그인하십시오</h5>

                    <div data-mdb-input-init class="form-outline form-white mb-4">
                        <input type="email" id="typeEmailX" class="form-control form-control-lg" name="id" />
                        <label class="form-label" for="typeEmailX">이메일</label>
                    </div>

                    <div data-mdb-input-init class="form-outline form-white mb-4">
                        <input type="password" id="typePasswordX" class="form-control form-control-lg" name="password" />
                        <label class="form-label" for="typePasswordX">패스워드</label>
                    </div>


                    <div class="pt-1 mb-4">
                        <p class="small mb-5 pb-lg-2"><a class="text-white-50" href="#!">패스워드 찾기</a></p>
                        <button data-mdb-button-init data-mdb-ripple-init class="btn btn-dark btn-lg btn-block" type="submit">로그인</button>
                    </div>

                    <a class="small text-muted" href="#!">비밀번호를 잊으셨나요?</a>
                    <p class="mb-5 pb-lg-2" style="color: #393f81;">계정이 없으신가요? <a href="#!"
                        style="color: #393f81;">회원가입</a></p>
                    <a href="#!" class="small text-muted">이용약관.</a>
                    <a href="#!" class="small text-muted">개인 정보 보호 정책</a>
                </form>

                

                </div>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>
    </section>
  <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../Js/login.js">
</head>
