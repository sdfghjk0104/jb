<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 페이지</title>

    <!-- ✅ Bootstrap 스타일 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- ✅ 사용자 CSS -->
    <link rel="stylesheet" href="../css/login.css" />

    <!-- ✅ JavaScript (유효성 검사용) -->
    <script src="../js/login.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.5/purify.min.js"></script>

  </head>

  <body>
    <section class="vh-100" style="background-color: #090e07;">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col col-xl-10">
            <div class="card" style="border-radius: 1rem;">
              <div class="row g-0">
                <div class="col-md-6 col-lg-5 d-none d-md-block">
                  <img
                    src="../image/login.LOGO.png"
                    alt="login form"
                    class="img-fluid"
                    style="border-radius: 1rem 0 0 1rem;"
                  />
                </div>
                <div class="col-md-6 col-lg-7 d-flex align-items-center">
                  <div class="card-body p-4 p-lg-5 text-black">
                    <form id="login_form" onsubmit="return check_input()" method="get" action="../index.html">
                      <div class="d-flex align-items-center mb-3 pb-1">
                        <i class="fas fa-cubes fa-2x me-3" style="color: #ff6219;"></i>
                        <span class="h1 fw-bold mb-0">Sooq</span>
                      </div>

                      <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">
                        귀하의 계정에 로그인하십시오
                      </h5>

                      <div class="form-outline form-white mb-4">
                        <input type="email" id="typeEmailX" name="id" class="form-control form-control-lg" />
                        <label class="form-label" for="typeEmailX">이메일</label>
                      </div>

                      <div class="form-outline form-white mb-4">
                        <input
                          type="password"
                          id="typePasswordX"
                          name="password"
                          class="form-control form-control-lg"
                        />
                        <label class="form-label" for="typePasswordX">패스워드</label>
                      </div>

                      <p class="small mb-5 pb-lg-2">
                        <a href="#!" class="small text-muted">패스워드 찾기</a>
                      </p>

                    <div class="checkbox mb-3">
                        <label>
                        <input type="checkbox" value="remember-me" id="idSaveCheck"> 아이디 기억
                        </label>
                    </div>

                      <div class="pt-1 mb-4">
                        <button class="btn btn-dark btn-lg btn-block" type="submit">로그인</button>
                      </div>

                      <p class="mb-5 pb-lg-2" style="color: #393f81;">
                        계정이 없으신가요?
                        <a href="#!" style="color: #393f81;">회원가입</a>
                      </p>
                      <a href="#!" class="small text-muted">이용약관.</a>
                      <a href="#!" class="small text-muted">개인 정보 보호 정책</a>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <body class="text-center" onload="init();"></body>
  </body>
</html>
