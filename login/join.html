<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 페이지</title>

    <!-- ✅ Bootstrap 스타일 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- ✅ 사용자 CSS -->
    <link rel="stylesheet" href="../css/login.css" />

    <!-- ✅ 외부 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.5/purify.min.js"></script>

    <!-- ✅ 사용자 JS -->
    <script src="../js/jwt_token.js" defer></script>
    <script type="module" src="../js/join.js" defer></script>
  </head>

  <body>
    <section class="vh-100 bg-image" style="background-image: url('../image/ww.avif');">
      <div class="mask d-flex align-items-center h-100 gradient-custom-3">
        <div class="container h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
              <div class="card" style="border-radius: 15px;">
                <div class="card-body p-5">
                  <h2 class="text-uppercase text-center mb-5">회원가입</h2>

                  <form id="join_form">
                    <div class="form-outline mb-4">
                      <input type="text" id="form3Example1c" class="form-control form-control-lg" />
                      <label class="form-label" for="form3Example1c">닉네임</label>
                    </div>

                    <div class="form-outline mb-4">
                      <input type="email" id="form3Example3c" class="form-control form-control-lg" />
                      <label class="form-label" for="form3Example3c">이메일</label>
                    </div>

                    <div class="form-outline mb-4">
                      <input type="password" id="form3Example4c" class="form-control form-control-lg" />
                      <label class="form-label" for="form3Example4c">비밀번호</label>
                    </div>

                    <div class="form-outline mb-4">
                      <input type="password" id="form3Example4cd" class="form-control form-control-lg" />
                      <label class="form-label" for="form3Example4cd">비밀번호 재입력</label>
                    </div>

                    <div class="form-check d-flex justify-content-center mb-5">
                      <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3c" />
                      <label class="form-check-label" for="form2Example3c">
                        나는 모든 진술에 동의합니다 <a href="#!" class="text-body"><u>서비스 약관</u></a>
                      </label>
                    </div>

                    <div class="d-flex justify-content-center">
                    <button
                        id="join_btn"
                        type="button"
                        class="btn btn-success btn-block btn-lg gradient-custom-4 text-body"
                        onclick="location.href='../index.html';"
                    >
                        가입하기
                    </button>
                    </div>


                    <p class="text-center text-muted mt-5 mb-0">
                      이미 계정이 있으신가요?
                      <a href="#!" class="fw-bold text-body"><u>여기에 로그인하세요</u></a>
                    </p>
                  </form>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
