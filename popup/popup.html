<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝업창 테스트</title>

    <!-- ✅ Bootstrap 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ✅ popup.js 연결 -->
    <script src="../Js/pop_up.js" defer></script>
  </head>

  <body onload="show_clock();" class="p-4">

    <!-- ✅ 제목과 아이콘 -->
    <h1 class="display-1">
      <i class="bi bi-alarm"></i> 팝업창 확인
    </h1>

    <!-- ✅ 시간 표시 -->
    <div id="divClock" class="clock display-5 text-muted"></div>
    <h1 class="display-4"><div id="Time" class="clock"></div></h1>

    <script src="../Js/popup_close.js"></script>
  </body>
</html>
