<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝업창 테스트</title>

    <!-- ✅ Bootstrap 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ✅ popup.js 연결 -->
    <script src="../Js/pop_up.js" defer></script>
  </head>

  <body onload="show_clock();" class="p-4">

    <!-- ✅ 제목과 아이콘 -->
    <h1 class="display-1">
      <i class="bi bi-alarm"></i> 팝업창 확인
    </h1>

    <!-- ✅ 시간 표시 -->
    <div id="divClock" class="clock display-5 text-muted"></div>
    <h1 class="display-4"><div id="Time" class="clock"></div></h1>

    <input class="form-check-input" type="checkbox" id="check_popup" onclick="closePopup();">
    <label class="form-check-label" for="flexCheckChecked">하루에 한번만 열기</label>

    <button onclick="closePopupForDays(3)">3일간 보지 않기</button>


    <script src="../Js/popup_close.js"></script>

    <script>
      function closePopupForDays(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        document.cookie = "popupYN=N; expires=" + date.toUTCString() + "; path=/";
        window.close(); // 팝업창 닫기
    }
</script>

  </body>
</html>
